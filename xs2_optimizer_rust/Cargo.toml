[package]
name = "xs2_optimizer"
version = "1.0.0"
edition = "2021"

[dependencies]
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi", "tlhelp32", "shellapi"] }
windows = { version = "0.58", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Registry", "Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
